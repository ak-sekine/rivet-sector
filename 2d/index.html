<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b171f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Rivet Sector — 2D Training Lab</title>
  </head>
  <body>
    <main id="lab">
      <div id="game" aria-label="2Dシューティング訓練エリア"></div>
      <header class="hud">
        <div class="brand"><span class="brand-mark">R</span><div><h1>RIVET SECTOR</h1><p>2D / TRAINING LAB <span class="live-dot"></span></p></div></div>
        <div id="stamina2d" role="progressbar" aria-label="スタミナ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span>STAMINA</span><b id="stamina-value2d">100</b><div class="track"><i></i></div></div>
        <p class="telemetry">HITS <b id="hits">000</b><span>∞ ENERGY</span></p>
      </header>
      <nav class="tools"><a href="../" aria-label="TPS版へ戻る">TPS ↗</a><button id="mute" type="button" aria-pressed="false" aria-label="音声をミュート">音 ON</button></nav>
      <p class="help pc-help">WASD 移動 <span>·</span> マウス 照準 / 左長押し 射撃 <span>·</span> SPACE 回避 <span>·</span> M ミュート</p>
      <div id="move-stick" class="stick" aria-label="移動スティック"><span class="stick-ring"></span><i></i><b>MOVE</b></div>
      <div id="aim-stick" class="stick aim-stick" aria-label="照準・射撃スティック"><span class="stick-ring"></span><i></i><b>AIM / FIRE</b></div>
      <button id="dodge2d" type="button" aria-label="ステップ回避">回避<small>STEP</small></button>
      <p class="touch-help">左：移動 / 右：照準＋射撃 / 回避：ステップ</p>
      <p id="loading" role="status">訓練エリアを起動しています…</p>
      <section id="rotate-hint"><span>↻</span><h2>横画面でプレイ</h2><p>端末を横向きにすると<br>左右のスティックを操作できます。</p></section>
      <section id="error2d" role="alert" hidden></section>
    </main>
    <script type="module" src="/src/prototype2d/main.ts"></script>
  </body>
</html>
