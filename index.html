<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020b04" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Rivet Sector — 2D Action Shooter</title>
  </head>
  <body>
    <main id="lab">
      <header class="hud">
        <h1>RIVET SECTOR</h1>
        <div id="stamina2d" role="progressbar" aria-label="スタミナ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span>STAMINA</span> <b id="stamina-value2d">100</b><div class="track"><i></i></div></div>
        <p class="telemetry">HITS <b id="hits">000</b></p>
        <button id="mute" type="button" aria-pressed="false" aria-label="音声をミュート">音 ON</button>
      </header>
      <div id="game" aria-label="2Dシューティング訓練エリア"></div>
      <section id="controls" aria-label="タッチ操作パネル">
        <div id="move-stick" class="stick" aria-label="移動スティック"><span class="stick-ring"></span><i></i><b>MOVE</b></div>
        <button id="dodge2d" type="button" aria-label="ステップ回避">回避<small>STEP</small></button>
        <div id="aim-stick" class="stick aim-stick" aria-label="照準・射撃スティック"><span class="stick-ring"></span><i></i><b>AIM / FIRE</b></div>
      </section>
      <p class="pc-help">WASD 移動 · マウス 照準／長押し 射撃 · SPACE 回避 · M ミュート</p>
      <p id="loading" role="status">訓練エリアを起動しています…</p>
      <section id="size-hint" role="status" hidden>縦向きにするか、表示領域を広げてください。操作には幅280px・高さ440px以上が必要です。</section>
      <section id="error2d" role="alert" hidden></section>
    </main>
    <script type="module" src="/src/prototype2d/main.ts"></script>
  </body>
</html>
