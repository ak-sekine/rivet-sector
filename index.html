<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101923" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rivet Sector" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Rivet Sector — TPS Prototype</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Rivet Sector TPS操作画面" tabindex="0"></canvas>
      <header class="panel">
        <h1>RIVET SECTOR</h1>
        <div id="stamina" role="progressbar" aria-label="スタミナ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div class="stamina-caption">STAMINA <span id="stamina-value">100 / 100</span></div>
          <div class="stamina-track"><span></span></div>
        </div>
        <p class="pc-help">WASD：移動 / Shift：回避 / クリック：マウス固定 / Esc：解除<br>固定後の左クリック・F：射撃 / 固定不可の場合はドラッグ＋F</p>
        <p class="touch-help">左スティック：移動 / スワイプ：視点 / 回避：ステップ / 射撃：発射</p>
        <p class="portrait-hint">スマートフォンは横画面を推奨します。</p>
      </header>
      <div id="stick" aria-label="移動スティック"><span></span></div>
      <button id="dodge" type="button" aria-label="ステップ回避">回避</button>
      <button id="shoot" type="button" aria-label="エネルギー銃を射撃">射撃</button>
      <div id="reticle" aria-hidden="true"></div>
      <p id="status" role="status">WebGLを初期化しています…</p>
      <section id="error" role="alert" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
